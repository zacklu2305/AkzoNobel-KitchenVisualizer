                    <main class="flex-1 relative bg-gray-100 overflow-hidden flex items-center justify-center p-4 md:p-8">
                        <div id="image-stage" class="relative w-full h-full flex items-center justify-center">
                            <img id="base-img" src="${model.baseImageUrl}" class="max-w-full max-h-full w-auto h-auto object-contain block rounded-lg shadow-lg select-none pointer-events-none" onload="updateCompareRect()">
                            <img id="overlay-layer" src="" class="overlay-img absolute inset-0 m-auto max-w-full max-h-full w-auto h-auto object-contain rounded-lg select-none pointer-events-none">
                            <img id="compare-left-overlay" src="" style="display: none;" class="overlay-img absolute inset-0 m-auto max-w-full max-h-full w-auto h-auto object-contain rounded-lg select-none pointer-events-none">
                            <img id="compare-right-overlay" src="" style="display: none;" class="overlay-img absolute inset-0 m-auto max-w-full max-h-full w-auto h-auto object-contain rounded-lg select-none pointer-events-none">
                            <div id="compare-container" style="display: none; touch-action: none;" class="absolute rounded-lg overflow-hidden select-none cursor-ew-resize z-20">
                                <span id="label-before" onclick="event.stopPropagation(); setCompareTargetSide('left');" class="cursor-pointer pointer-events-auto absolute top-3 left-3 bg-black/60 backdrop-blur-sm text-white text-[10px] sm:text-xs font-semibold uppercase px-2 py-0.5 rounded tracking-wider shadow select-none z-10 hover:bg-black/80 transition-colors">Before</span>
                                <span id="label-after" onclick="event.stopPropagation(); setCompareTargetSide('right');" class="cursor-pointer pointer-events-auto absolute top-3 right-3 bg-black/60 backdrop-blur-sm text-white text-[10px] sm:text-xs font-semibold uppercase px-2 py-0.5 rounded tracking-wider shadow select-none z-10 hover:bg-black/80 transition-colors">After</span>
                                <div id="compare-divider" class="absolute top-0 bottom-0 w-[2px] bg-white shadow-[0_0_4px_rgba(0,0,0,0.6)] pointer-events-none" style="left: 50%; transform: translateX(-50%);">
                                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white shadow-lg border border-gray-200 flex items-center justify-center pointer-events-auto">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" strokeLinecap="round" strokeLinejoin="round" class="text-gray-700">
                                            <polyline points="8 15 5 12 8 9"></polyline>
                                            <polyline points="16 9 19 12 16 15"></polyline>
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="absolute bottom-4 left-0 right-0 text-center z-10 pointer-events-none">
                            <p class="text-[9px] font-bold uppercase tracking-[0.4em] text-gray-400 opacity-50">Developed by Zack Lu</p>
                        </div>
                    </main>
                    <footer class="h-36 bg-white border-t border-gray-100 flex flex-col justify-center px-8 md:px-12 gap-2 overflow-hidden">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-gray-400 hidden md:block">Cabinet Finish</span>
                            <div id="segment-toggle-container" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar max-w-full py-0.5">
                                ${getSegmentToggleHtml(model)}
                            </div>
                        </div>
                        <div id="swatch-container" class="flex gap-4 overflow-x-auto py-1 no-scrollbar items-center">
                            ${getSwatchesHtml(model)}
                        </div>
                    </footer>
                </div>
            `;
            setupCompareEvents();
            syncCompareUI();
        }

        function selectModel(id) {
            activeModelId = id;
            selectedColorId = null;
            previousColorId = null;
            selectedSegmentId = null;
            isCompareActive = false;
            compareLeftColorId = null;
            compareRightColorId = null;
            compareTargetSide = null;
            const model = models.find(m => m.id === id);
            const segs = model.segments || [];
            const withColors = segs.filter(s => model.colors.some(c => (c.segmentId || c.segment) === s.id));
            selectedSegmentId = withColors[0] ? withColors[0].id : (segs[0] ? segs[0].id : '');
            render();
        }

        function back() {
            activeModelId = null;
            selectedColorId = null;
            previousColorId = null;
            selectedSegmentId = null;
            isCompareActive = false;
            compareLeftColorId = null;
            compareRightColorId = null;
            compareTargetSide = null;
            render();
        }

        function switchSegment(segId) {
            selectedSegmentId = segId;
            const model = models.find(m => m.id === activeModelId);
            const segContainer = document.getElementById('segment-toggle-container');
            const swatchContainer = document.getElementById('swatch-container');
            if (segContainer && model) {
                segContainer.innerHTML = getSegmentToggleHtml(model);
            }
            if (swatchContainer && model) {
                swatchContainer.innerHTML = getSwatchesHtml(model);
                swatchContainer.classList.remove('swatch-fade');
                void swatchContainer.offsetWidth;
                swatchContainer.classList.add('swatch-fade');
            }
        }

        function selectColor(id) {
            const model = models.find(m => m.id === activeModelId);
            const color = model ? model.colors.find(c => c.id === id) : null;
            if (!color) return;

            if (!isCompareActive) {
                if (selectedColorId === id) return;
                previousColorId = selectedColorId;
                selectedColorId = id;
                updateOverlay(color.imageUrl);
                updateSwatchUI();
                syncCompareUI();
            } else {
                if (compareTargetSide === 'left') {
                    if (compareLeftColorId !== id) {
                        compareLeftColorId = id;
                        previousColorId = id;
                        updateSideOverlay('left', color.imageUrl);
                    }
                    compareTargetSide = null;
                } else if (compareTargetSide === 'right') {
                    if (compareRightColorId !== id) {
                        compareRightColorId = id;
                        selectedColorId = id;
                        updateSideOverlay('right', color.imageUrl);
                    }
                    compareTargetSide = null;
                } else {
                    // Auto mode
                    if (compareRightColorId === id) return;
                    const oldRight = compareRightColorId;
                    const oldLeft = compareLeftColorId;
                    compareLeftColorId = oldRight;
                    compareRightColorId = id;
                    previousColorId = oldRight;
                    selectedColorId = id;

                    if (oldLeft !== oldRight) {
                        const leftColor = model.colors.find(c => c.id === oldRight);
                        updateSideOverlay('left', leftColor ? leftColor.imageUrl : null);
                    }
                    updateSideOverlay('right', color.imageUrl);
                }
                updateSwatchUI();
                syncCompareUI();
            }
        }

        function resetColor() {
            selectedColorId = null;
            previousColorId = null;
            isCompareActive = false;
            compareLeftColorId = null;
            compareRightColorId = null;
            compareTargetSide = null;
            updateOverlay(null);
            updateSideOverlay('left', null);
            updateSideOverlay('right', null);
            updateSwatchUI();
            syncCompareUI();
        }

        function resetBeforeToOriginal() {
            if (!isCompareActive) return;
            if (compareLeftColorId !== null) {
                compareLeftColorId = null;
                previousColorId = null;
                updateSideOverlay('left', null);
                updateSwatchUI();
                syncCompareUI();
            }
        }

        function setCompareTargetSide(side) {
            if (compareTargetSide === side) {
                compareTargetSide = null;
            } else {
                compareTargetSide = side;
            }
            syncCompareUI();
            updateSwatchUI();
        }

        function updateOverlay(url) {
            const overlay = document.getElementById('overlay-layer');
            if (!overlay) return;
            overlay.classList.remove('visible');
            if (!url) {
                setTimeout(() => {
                    if (!selectedColorId && !isCompareActive) {
                        overlay.src = "";
                        overlay.style.clipPath = '';
                    }
                }, 300);
                return;
            }
            const tempImg = new Image();
            tempImg.onload = () => {
                overlay.src = url;
                overlay.style.clipPath = '';
                overlay.classList.add('visible');
            };
            tempImg.src = url;
        }

        function updateSideOverlay(side, url) {
            const overlay = document.getElementById(side === 'left' ? 'compare-left-overlay' : 'compare-right-overlay');
            if (!overlay) return;
            overlay.classList.remove('visible');
            if (!url) {
                setTimeout(() => {
                    overlay.src = "";
                    applySideClips();
                }, 300);
                return;
            }
            const tempImg = new Image();
            tempImg.onload = () => {
                overlay.src = url;
                applySideClips();
                overlay.classList.add('visible');
            };
            tempImg.src = url;
        }

        function applySideClips() {
            const leftOverlay = document.getElementById('compare-left-overlay');
            const rightOverlay = document.getElementById('compare-right-overlay');
            if (leftOverlay) {
                leftOverlay.style.clipPath = 'polygon(0% 0%, ' + comparePos + '% 0%, ' + comparePos + '% 100%, 0% 100%)';
            }
            if (rightOverlay) {
                rightOverlay.style.clipPath = 'polygon(' + comparePos + '% 0%, 100% 0%, 100% 100%, ' + comparePos + '% 100%)';
            }
        }

        function updateSwatchUI() {
            const model = models.find(m => m.id === activeModelId);
            if (!model) return;
            const swatchContainer = document.getElementById('swatch-container');
            if (swatchContainer) {
                swatchContainer.innerHTML = getSwatchesHtml(model);
            }
        }

        function updateCompareRect() {
            const baseImg = document.getElementById('base-img');
            const stage = document.getElementById('image-stage');
            const container = document.getElementById('compare-container');
            if (!baseImg || !stage || !container) return;
            const imgRect = baseImg.getBoundingClientRect();
            const stageRect = stage.getBoundingClientRect();
            if (imgRect.width === 0 || imgRect.height === 0) return;
            if (!baseImg.naturalWidth || !baseImg.naturalHeight) {
                container.style.left = (imgRect.left - stageRect.left) + 'px';
                container.style.top = (imgRect.top - stageRect.top) + 'px';
                container.style.width = imgRect.width + 'px';
                container.style.height = imgRect.height + 'px';
                return;
            }
            const imgRatio = baseImg.naturalWidth / baseImg.naturalHeight;
            const elemRatio = imgRect.width / imgRect.height;
            let rw = imgRect.width;
            let rh = imgRect.height;
            let ox = 0;
            let oy = 0;
            if (elemRatio > imgRatio) {
                rh = imgRect.height;
                rw = imgRect.height * imgRatio;
                ox = (imgRect.width - rw) / 2;
            } else {
                rw = imgRect.width;
                rh = imgRect.width / imgRatio;
                oy = (imgRect.height - rh) / 2;
            }
            container.style.left = (imgRect.left - stageRect.left + ox) + 'px';
            container.style.top = (imgRect.top - stageRect.top + oy) + 'px';
            container.style.width = rw + 'px';
            container.style.height = rh + 'px';
        }

        function setComparePosition(pct) {
            comparePos = Math.max(0, Math.min(100, pct));
            const divider = document.getElementById('compare-divider');
            if (divider) {
                divider.style.left = comparePos + '%';
            }
            if (isCompareActive) {
                applySideClips();
            }
        }

        function toggleCompare() {
            const model = models.find(m => m.id === activeModelId);
            if (!model || model.colors.length === 0) return;

            isCompareActive = !isCompareActive;
            if (isCompareActive) {
                comparePos = 50;
                compareTargetSide = null;
                compareLeftColorId = previousColorId;
                compareRightColorId = selectedColorId;
                const leftColor = model.colors.find(c => c.id === compareLeftColorId);
                const rightColor = model.colors.find(c => c.id === compareRightColorId);
                updateSideOverlay('left', leftColor ? leftColor.imageUrl : null);
                updateSideOverlay('right', rightColor ? rightColor.imageUrl : null);
            } else {
                selectedColorId = compareRightColorId;
                if (compareLeftColorId) {
                    previousColorId = compareLeftColorId;
                }
                compareTargetSide = null;
                const rightColor = model.colors.find(c => c.id === compareRightColorId);
                updateOverlay(rightColor ? rightColor.imageUrl : null);
                updateSideOverlay('left', null);
                updateSideOverlay('right', null);
            }
            syncCompareUI();
            updateSwatchUI();
        }

        function syncCompareUI() {
            const model = models.find(m => m.id === activeModelId);
            const btn = document.getElementById('compare-btn');
            const controls = document.getElementById('compare-controls');
            const resetMainBtn = document.getElementById('reset-main-btn');
            const container = document.getElementById('compare-container');
            const overlay = document.getElementById('overlay-layer');
            const leftOverlay = document.getElementById('compare-left-overlay');
            const rightOverlay = document.getElementById('compare-right-overlay');

            const hasColors = model && model.colors && model.colors.length > 0;
            if (!hasColors) {
                isCompareActive = false;
                if (btn) btn.classList.add('hidden');
                if (controls) controls.style.display = 'none';
                if (container) container.style.display = 'none';
                if (overlay) overlay.style.display = 'block';
                if (leftOverlay) leftOverlay.style.display = 'none';
                if (rightOverlay) rightOverlay.style.display = 'none';
                return;
            }

            if (btn) {
                btn.classList.remove('hidden');
                if (isCompareActive) {
                    btn.classList.add('text-black', 'font-bold');
                    btn.classList.remove('text-gray-400');
                } else {
                    btn.classList.remove('text-black', 'font-bold');
                    btn.classList.add('text-gray-400');
                }
            }

            if (controls) {
                controls.style.display = isCompareActive ? 'flex' : 'none';
            }

            const beforeSideBtn = document.getElementById('compare-side-before-btn');
            const afterSideBtn = document.getElementById('compare-side-after-btn');
            if (beforeSideBtn && afterSideBtn) {
                if (compareTargetSide === 'left') {
                    beforeSideBtn.className = "px-2.5 py-1 rounded-full transition-all bg-white text-black shadow-sm font-bold";
                    afterSideBtn.className = "px-2.5 py-1 rounded-full transition-all text-gray-500 hover:text-black";
                } else if (compareTargetSide === 'right') {
                    beforeSideBtn.className = "px-2.5 py-1 rounded-full transition-all text-gray-500 hover:text-black";
                    afterSideBtn.className = "px-2.5 py-1 rounded-full transition-all bg-white text-black shadow-sm font-bold";
                } else {
                    beforeSideBtn.className = "px-2.5 py-1 rounded-full transition-all text-gray-500 hover:text-black";
                    afterSideBtn.className = "px-2.5 py-1 rounded-full transition-all text-gray-500 hover:text-black";
                }
            }

            const labelBefore = document.getElementById('label-before');
            const labelAfter = document.getElementById('label-after');
            if (labelBefore && labelAfter) {
                if (compareTargetSide === 'left') {
                    labelBefore.className = "cursor-pointer pointer-events-auto absolute top-3 left-3 bg-white text-black ring-1 ring-black backdrop-blur-sm text-[10px] sm:text-xs font-semibold uppercase px-2 py-0.5 rounded tracking-wider shadow select-none z-10 transition-colors";
                    labelAfter.className = "cursor-pointer pointer-events-auto absolute top-3 right-3 bg-black/60 backdrop-blur-sm text-white text-[10px] sm:text-xs font-semibold uppercase px-2 py-0.5 rounded tracking-wider shadow select-none z-10 hover:bg-black/80 transition-colors";
                } else if (compareTargetSide === 'right') {
                    labelBefore.className = "cursor-pointer pointer-events-auto absolute top-3 left-3 bg-black/60 backdrop-blur-sm text-white text-[10px] sm:text-xs font-semibold uppercase px-2 py-0.5 rounded tracking-wider shadow select-none z-10 hover:bg-black/80 transition-colors";
                    labelAfter.className = "cursor-pointer pointer-events-auto absolute top-3 right-3 bg-white text-black ring-1 ring-black backdrop-blur-sm text-[10px] sm:text-xs font-semibold uppercase px-2 py-0.5 rounded tracking-wider shadow select-none z-10 transition-colors";
                } else {
                    labelBefore.className = "cursor-pointer pointer-events-auto absolute top-3 left-3 bg-black/60 backdrop-blur-sm text-white text-[10px] sm:text-xs font-semibold uppercase px-2 py-0.5 rounded tracking-wider shadow select-none z-10 hover:bg-black/80 transition-colors";
                    labelAfter.className = "cursor-pointer pointer-events-auto absolute top-3 right-3 bg-black/60 backdrop-blur-sm text-white text-[10px] sm:text-xs font-semibold uppercase px-2 py-0.5 rounded tracking-wider shadow select-none z-10 hover:bg-black/80 transition-colors";
                }
            }

            if (container) {
                if (isCompareActive) {
                    container.style.display = 'block';
                    updateCompareRect();
                    setComparePosition(comparePos);
                    if (overlay) overlay.style.display = 'none';
                    if (leftOverlay) leftOverlay.style.display = 'block';
                    if (rightOverlay) rightOverlay.style.display = 'block';
                } else {
                    container.style.display = 'none';
                    if (overlay) overlay.style.display = 'block';
                    if (leftOverlay) leftOverlay.style.display = 'none';
                    if (rightOverlay) rightOverlay.style.display = 'none';
                }
            }
        }

        function setupCompareEvents() {
            const container = document.getElementById('compare-container');
            if (!container || container.dataset.hasCompareEvents) return;
            container.dataset.hasCompareEvents = 'true';
            function handlePointer(clientX) {
                const rect = container.getBoundingClientRect();
                if (rect.width <= 0) return;
                const relX = clientX - rect.left;
                const pct = (relX / rect.width) * 100;
                setComparePosition(pct);
            }
            container.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                try { container.setPointerCapture(e.pointerId); } catch(err) {}
                isDraggingCompare = true;
                handlePointer(e.clientX);
            });
            container.addEventListener('pointermove', (e) => {
                if (isDraggingCompare || e.buttons === 1) {
                    e.preventDefault();
                    handlePointer(e.clientX);
                }
            });
            const stopDrag = (e) => {
                if (isDraggingCompare) {
                    isDraggingCompare = false;
                    try { container.releasePointerCapture(e.pointerId); } catch(err) {}
                }
            };
            container.addEventListener('pointerup', stopDrag);
            container.addEventListener('pointercancel', stopDrag);
            container.addEventListener('touchstart', (e) => {
                if (e.touches && e.touches[0]) {
                    e.preventDefault();
                    isDraggingCompare = true;
                    handlePointer(e.touches[0].clientX);
                }
            }, { passive: false });
            container.addEventListener('touchmove', (e) => {
                if (isDraggingCompare && e.touches && e.touches[0]) {
                    e.preventDefault();
                    handlePointer(e.touches[0].clientX);
                }
            }, { passive: false });
            container.addEventListener('touchend', () => {
                isDraggingCompare = false;
            });
        }
        window.addEventListener('resize', updateCompareRect);
        render();
    </script>
</body>
</html>
